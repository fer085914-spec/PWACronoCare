<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Tomar Fotografía</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222',
                        'crono-btn-light': '#A8C9C9'
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden flex flex-col">

    <div class="bg-crono-blue text-white p-4 shadow-md flex justify-between items-center z-10 w-full">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center overflow-hidden shadow-sm">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold tracking-wide">CronoCare</h1>
        </div>
    </div>

    <!-- VISTA MÓVIL -->
    <div class="md:hidden flex-1 pb-24 w-full flex flex-col p-6 items-center">

        <h2 class="text-sm font-bold text-center text-black mb-6 tracking-wide uppercase">TOMAR FOTOGRAFÍA</h2>

        <!-- PASO 1: VISOR DE CÁMARA EN VIVO -->
        <div id="pasoVisor" class="w-full flex flex-col items-center transition-all duration-300">
            <div class="w-full h-56 bg-black rounded-3xl overflow-hidden border border-gray-300 flex items-center justify-center mb-8 shadow-inner relative">
                <video id="videoCamara" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>

            <button id="btnTomarFoto" type="button" class="bg-crono-teal text-white font-bold py-3 px-8 rounded-full hover:bg-crono-blue transition-colors shadow-md text-xs tracking-wider uppercase">
                Tomar Fotografía
            </button>
        </div>

        <!-- PASO 2: FOTO CAPTURADA / VALIDACIÓN -->
        <div id="pasoCaptura" class="w-full flex flex-col items-center hidden transition-all duration-300">
            <div class="w-full h-56 bg-[#D4DFE2] rounded-3xl overflow-hidden border border-gray-300 flex items-center justify-center mb-6 shadow-inner relative">
                <canvas id="canvasFoto" class="hidden"></canvas>
                <img id="imagenPrevisualizacion" src="" alt="Foto Capturada" class="w-full h-full object-cover">
            </div>

            <p class="text-sm font-semibold mb-6 text-gray-800 text-center">¿La fotografía es clara?</p>

            <div class="flex gap-4 w-full justify-center">
                <button id="btnRepetir" type="button" class="bg-crono-btn-light text-crono-dark font-bold py-3 px-8 rounded-full hover:bg-gray-300 transition-colors shadow-md text-xs tracking-wider uppercase">
                    Repetir
                </button>
                <button id="btnAceptar" type="button" class="bg-crono-teal text-white font-bold py-3 px-8 rounded-full hover:bg-crono-blue transition-colors shadow-md text-xs tracking-wider uppercase">
                    Aceptar
                </button>
            </div>
        </div>

    </div>

    <!-- VISTA ESCRITORIO (Bloqueada) -->
    <div class="hidden md:flex flex-1 flex-col items-center justify-center p-10 text-center bg-white m-10 rounded-3xl shadow-sm border border-gray-200">
        <span class="text-6xl mb-4">📱</span>
        <h2 class="text-2xl font-bold text-crono-dark mb-2">Función exclusiva para móviles</h2>
        <p class="text-gray-600 max-w-md">La captura de fotografías requiere el uso de la cámara de tu teléfono celular. Por favor, accede a esta función desde tu dispositivo móvil.</p>
        <button type="button" onclick="window.history.back();" class="mt-8 bg-crono-blue text-white font-bold py-3 px-8 rounded-full shadow-md hover:bg-blue-700 transition-colors">
            VOLVER AL FORMULARIO
        </button>
    </div>

    <script>
        const CLAVE_FOTO_TEMP = 'fotoMedicamentoTemp';

        const visor = document.getElementById('pasoVisor');
        const captura = document.getElementById('pasoCaptura');
        const video = document.getElementById('videoCamara');
        const canvas = document.getElementById('canvasFoto');
        const imagenPrevisualizacion = document.getElementById('imagenPrevisualizacion');

        const btnTomarFoto = document.getElementById('btnTomarFoto');
        const btnRepetir = document.getElementById('btnRepetir');
        const btnAceptar = document.getElementById('btnAceptar');

        let streamCamara = null;

        function detenerCamara() {
            if (streamCamara) {
                streamCamara.getTracks().forEach(track => track.stop());
                streamCamara = null;
            }
            if (video) {
                video.srcObject = null;
            }
        }

        function resetearVisorDesdeCero() {
            detenerCamara();
            sessionStorage.removeItem(CLAVE_FOTO_TEMP);

            if (imagenPrevisualizacion) {
                imagenPrevisualizacion.src = '';
            }

            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx?.clearRect(0, 0, canvas.width || 1, canvas.height || 1);
                canvas.width = 0;
                canvas.height = 0;
            }

            if (btnAceptar) {
                btnAceptar.disabled = false;
                btnAceptar.textContent = 'Aceptar';
            }

            captura.classList.add('hidden');
            visor.classList.remove('hidden');
        }

        async function iniciarCamara() {
            detenerCamara();

            try {
                streamCamara = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: 'environment' } },
                    audio: false
                });
            } catch (error) {
                try {
                    streamCamara = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                } catch (err) {
                    await Swal.fire({
                        title: 'Cámara no disponible',
                        text: 'No se pudo acceder a la cámara. Verifica los permisos del navegador.',
                        icon: 'error',
                        confirmButtonText: 'Aceptar',
                        confirmButtonColor: '#287F89',
                        background: '#E1F4F6',
                        color: '#222222',
                        customClass: {
                            popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                        }
                    });
                    return;
                }
            }
            video.srcObject = streamCamara;
        }

        async function prepararVistaNuevaCaptura() {
            resetearVisorDesdeCero();
            await iniciarCamara();
        }

        // Arranca limpio al cargar o al regresar desde el historial del navegador (bfcache)
        document.addEventListener('DOMContentLoaded', prepararVistaNuevaCaptura);
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                prepararVistaNuevaCaptura();
            }
        });
        window.addEventListener('pagehide', detenerCamara);

        btnTomarFoto.addEventListener('click', () => {
            if (!video.videoWidth || !video.videoHeight) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const contexto = canvas.getContext('2d');
            contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataURL = canvas.toDataURL('image/png');
            imagenPrevisualizacion.src = dataURL;

            detenerCamara();

            visor.classList.add('hidden');
            captura.classList.remove('hidden');
        });

        btnRepetir.addEventListener('click', async () => {
            imagenPrevisualizacion.src = '';
            captura.classList.add('hidden');
            visor.classList.remove('hidden');
            await iniciarCamara();
        });

        btnAceptar.addEventListener('click', () => {
            btnAceptar.disabled = true;
            btnAceptar.textContent = 'GUARDANDO...';

            canvas.toBlob((blob) => {
                if (!blob) {
                    btnAceptar.disabled = false;
                    btnAceptar.textContent = 'Aceptar';
                    return;
                }

                const reader = new FileReader();
                reader.onloadend = () => {
                    sessionStorage.setItem(CLAVE_FOTO_TEMP, reader.result);
                    setTimeout(() => {
                        window.history.back();
                    }, 300);
                };
                reader.readAsDataURL(blob);
            }, 'image/png');
        });
    </script>
</body>
</html>
