<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Menú Principal</title>
    <!--
        Corre antes de renderizar el <body> para evitar contenido protegido sino hay sesión activa
    -->
    <script>
        (function () {
            const CLAVE_SESION = 'usuarioLogueado';

            function tieneSesionValida() {
                const guardado = localStorage.getItem(CLAVE_SESION);
                if (!guardado) return false;
                try {
                    const u = JSON.parse(guardado);
                    // Acepta tanto 'id' como 'idUsuario' según el formato devuelto por la API
                    const id = u && (u.id ?? u.idUsuario);
                    return Boolean(id);
                } catch (e) {
                    return false;
                }
            }

            if (!tieneSesionValida()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return;
            }

            window.addEventListener('pageshow', (event) => {
                if (event.persisted && !tieneSesionValida()) {
                    document.documentElement.style.display = 'none';
                    window.location.replace('login.html');
                }
            });
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>

</head>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        const CLAVE_SESION = 'usuarioLogueado';
        const API = '/api/Auth';

        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem(CLAVE_SESION);
            if (!guardado) return null;
            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? { id: Number(id), nombre: u.nombre, tipoUso: u.tipoUso } : null;
            } catch (e) {
                return null;
            }
        }

        // Revalida que haya sesión activa
        function verificarSesionActiva() {
            if (!obtenerUsuarioSesion()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return false;
            }
            document.documentElement.style.display = '';
            return true;
        }

        // Limpia sesión y claves de ambos storages
        function cerrarSesion() {
            document.documentElement.style.display = 'none';
            localStorage.removeItem(CLAVE_SESION);
            localStorage.removeItem('perfilSeleccionado');
            sessionStorage.removeItem('perfilSeleccionado');
            sessionStorage.removeItem('empleados_usuario');
            sessionStorage.removeItem('cronocare_usuario');
            window.location.replace('login.html');
        }

        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesionPc')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesion')?.addEventListener('click', cerrarSesion);

        async function llamarApi(url, opciones) {
            const respuesta = await fetch(url, opciones);
            let datos = null;
            try { datos = await respuesta.json(); } catch (e) { }
            if (!respuesta.ok) {
                throw new Error((datos && datos.message) || 'No se pudo completar la solicitud.');
            }
            return datos;
        }

        // Inicia el saludo y carga los perfiles con medicamentos activos
        async function inicializarVistaIndex() {
            const usuario = obtenerUsuarioSesion();
            if (!usuario) {
                document.documentElement.style.display = 'none';
                window.location.replace("login.html");
                return;
            }

            document.documentElement.style.display = '';

            const spanNombre = document.getElementById("nombreUsuario");
            if (spanNombre && usuario.nombre) {
                spanNombre.textContent = usuario.nombre;
            }

            await cargarSeccionesPerfiles(usuario.id);
        }

        document.addEventListener("DOMContentLoaded", inicializarVistaIndex);

        window.addEventListener("pageshow", (event) => {
            if (!verificarSesionActiva()) return;
            if (event.persisted) {
                inicializarVistaIndex();
            }
        });

        //  tarjeta de un medicamento activo con enlace al detalle y acción para ocultarlo
        function renderizarTarjetaMedicamento(med) {
            const idMed = med.idMedicamento ?? med.ID_MEDICAMENTO ?? med.id;
            const nombreMed = med.nombreMedicamento ?? med.NOMBRE_MEDICAMENTO ?? 'Medicamento';
            const proximaTomaTexto = med.proximaToma
                ? new Date(med.proximaToma).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : 'Pendiente';

            const tarjeta = document.createElement("div");
            tarjeta.className = "bg-white rounded-2xl p-3.5 shadow-xs border border-gray-200 hover:border-crono-teal hover:shadow-sm transition-all group flex items-center justify-between gap-3";
            tarjeta.innerHTML = `
                            <a href="detalle_farmaco.html?id=${idMed}" class="flex items-center gap-3 flex-1 min-w-0">
                                <div class="w-10 h-10 bg-crono-light rounded-full flex items-center justify-center shrink-0 group-hover:bg-crono-teal transition-colors">
                                    <svg class="w-5 h-5 text-crono-blue group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M17.34 6.66a5.5 5.5 0 00-7.78 0L6.66 9.56a5.5 5.5 0 000 7.78 5.5 5.5 0 007.78 0l2.9-2.9a5.5 5.5 0 000-7.78zm-4.24 6.36l-2.12-2.12m5.66-2.12L13.1 5.24"></path>
                                    </svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-crono-dark text-sm md:text-base truncate group-hover:text-crono-teal transition-colors">${nombreMed}</h4>
                                    <p class="text-xs text-gray-500 mt-0.5">Vía: <span class="font-medium">${med.viaAdministracion || 'General'}</span> · Próxima toma: <span class="font-semibold text-crono-blue">${proximaTomaTexto}</span></p>
                                </div>
                            </a>
                            <button type="button" class="btn-ocultar-med text-gray-400 hover:text-red-500 transition-colors p-2 shrink-0" title="Eliminar medicamento">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2.000 2.000 0 0116.138 21H7.862a2.000 2.000 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        `;

            tarjeta.querySelector(".btn-ocultar-med").addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!idMed) return;
                confirmarOcultarMedicamento(idMed, nombreMed);
            });

            return tarjeta;
        }

        // Consultar perfiles del usuario y filtrar solo los que tengan al menos un fármaco activo
        async function cargarSeccionesPerfiles(idUsuario) {
            const contenedor = document.getElementById("contenedorPerfilesIndex");

            try {
                const perfiles = await llamarApi(`${API}/perfiles/${idUsuario}`);

                if (!perfiles || perfiles.length === 0) {
                    contenedor.innerHTML = `
                                    <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                                        <p class="text-gray-500 text-sm mb-2">No tienes medicación activa por el momento.</p>
                                        <a href="perfiles.html" class="text-crono-teal font-bold hover:underline text-sm">Ver o gestionar perfiles aquí</a>
                                    </div>`;
                    return;
                }

                // mostrar únicamente los perfiles que cuenten con medicamentos activos
                const perfilesConActivos = [];

                for (const perfil of perfiles) {
                    const idPerfil = perfil.idPerfil ?? perfil.ID_PERFIL ?? perfil.id;
                    const nombrePerfil = perfil.nombre ?? perfil.NOMBRE ?? 'Perfil';

                    try {
                        const medicamentos = await llamarApi(`${API}/medicamentos/activos/${idUsuario}/${idPerfil}`);
                        if (medicamentos && medicamentos.length > 0) {
                            perfilesConActivos.push({
                                idPerfil,
                                nombrePerfil,
                                medicamentos
                            });
                        }
                    } catch (errMed) {
                        console.error(`Error cargando medicamentos del perfil ${idPerfil}:`, errMed);
                    }
                }

                // Si existen perfiles pero ninguno tiene tratamientos activos, se muestra el estado vacío
                if (perfilesConActivos.length === 0) {
                    contenedor.innerHTML = `
                                    <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                                        <p class="text-gray-600 text-sm font-medium mb-2">No tienes medicación activa en este momento.</p>
                                        <a href="perfiles.html" class="text-crono-teal font-bold hover:underline text-sm">Registrar o ver perfiles aquí</a>
                                    </div>`;
                    return;
                }

                contenedor.innerHTML = "";

                // muestra un desplegable por cada perfil con medicación activa
                for (const item of perfilesConActivos) {
                    const { idPerfil, nombrePerfil, medicamentos } = item;
                    const total = medicamentos.length;

                    const card = document.createElement("div");
                    card.className = "bg-white rounded-3xl md:rounded-full shadow-sm border border-[#287F89]/50 overflow-hidden transition-all";
                    card.id = `acordeon-wrapper-${idPerfil}`;

                    card.innerHTML = `
                                    <button type="button" onclick="toggleAcordeon('perfil-${idPerfil}', 'acordeon-wrapper-${idPerfil}')" class="w-full px-5 py-4 bg-white flex justify-between items-center hover:bg-crono-light/30 transition-colors">
                                        <div class="flex items-center gap-3.5">
                                            <div class="w-11 h-11 bg-[#DCEEEF] text-crono-blue rounded-full flex items-center justify-center shrink-0">
                                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                                                </svg>
                                            </div>
                                            <div class="text-left">
                                                <h3 class="font-bold text-crono-dark text-sm md:text-base leading-tight">${nombrePerfil}</h3>
                                                <p class="text-xs text-gray-500 mt-0.5" id="contador-${idPerfil}">${total} ${total === 1 ? 'Medicamento activo' : 'Medicamentos activos'}</p>
                                            </div>
                                        </div>
                                        <svg id="icon-perfil-${idPerfil}" class="w-5 h-5 text-crono-teal transform transition-transform duration-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                        </svg>
                                    </button>

                                    <div id="perfil-${idPerfil}" class="hidden flex-col gap-2.5 px-5 pb-5 pt-3 bg-gray-50/80 border-t border-gray-100 rounded-b-3xl">
                                    </div>
                                `;

                    const contenedorLista = card.querySelector(`#perfil-${idPerfil}`);
                    medicamentos.forEach((med) => {
                        contenedorLista.appendChild(renderizarTarjetaMedicamento(med));
                    });

                    contenedor.appendChild(card);
                }

            } catch (error) {
                console.error("Error al cargar perfiles para el dashboard:", error);
                contenedor.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm text-center"><p class="text-red-500 text-sm">Error al cargar la información.</p></div>`;
            }
        }

        // Expande o contrae el listado de fármacos de un perfil;
        function toggleAcordeon(idSeccion, idWrapper) {
            const contenido = document.getElementById(idSeccion);
            const icono = document.getElementById('icon-' + idSeccion);
            const wrapper = idWrapper ? document.getElementById(idWrapper) : null;

            if (contenido.classList.contains('hidden')) {
                contenido.classList.remove('hidden');
                contenido.classList.add('flex');
                if (icono) icono.classList.add('rotate-180');
                if (wrapper) {
                    wrapper.classList.remove('md:rounded-full');
                    wrapper.classList.add('md:rounded-3xl');
                }
            } else {
                contenido.classList.add('hidden');
                contenido.classList.remove('flex');
                if (icono) icono.classList.remove('rotate-180');
                if (wrapper) {
                    wrapper.classList.add('md:rounded-full');
                    wrapper.classList.remove('md:rounded-3xl');
                }
            }
        }

        // Solicita confirmación, oculta el fármaco en el y recarga las secciones
        async function confirmarOcultarMedicamento(idMedicamento, nombre) {
            const confirmacion = await Swal.fire({
                title: "¿Eliminar medicamento?",
                text: `¿Deseas eliminar "${nombre}" de los medicamentos activos?`,
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí, eliminar",
                cancelButtonText: "Cancelar",
                confirmButtonColor: "#287F89",
                cancelButtonColor: "#6B7280",
                background: "#E1F4F6",
                color: "#222222",
                customClass: {
                    popup: "rounded-3xl shadow-2xl border-2 border-[#287F89]"
                }
            });

            if (!confirmacion.isConfirmed) return;

            try {
                const usuario = obtenerUsuarioSesion();
                const queryUsuario = usuario ? `?idUsuario=${usuario.id}` : '';
                const response = await fetch(`${API}/medicamento/ocultar/${idMedicamento}${queryUsuario}`, {
                    method: 'PUT'
                });
                const resultado = await response.json();
                if (!response.ok) throw new Error(resultado.mensaje || "No se pudo eliminar el medicamento.");

                // consultar el esquema para actualizar contadores y ocultar perfiles si quedaron sin fármacos
                if (usuario) await cargarSeccionesPerfiles(usuario.id);
            } catch (error) {
                console.error("Error:", error);
                Swal.fire({
                    title: "Error",
                    text: "Error al eliminar el medicamento.",
                    icon: "error",
                    confirmButtonText: "Aceptar",
                    confirmButtonColor: "#287F89",
                    background: "#E1F4F6",
                    color: "#222222",
                    customClass: {
                        popup: "rounded-3xl shadow-2xl border-2 border-[#287F89]"
                    }
                });
            }
        }
    </script>
</body>
</html>
