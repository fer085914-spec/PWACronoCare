    <!-- Guard de sesión temprano: oculta la página y redirige si no hay usuario válido -->
    <script>
        (function () {
            function tieneSesionValida() {
                const guardado = localStorage.getItem('usuarioLogueado') || sessionStorage.getItem('empleados_usuario');
                if (!guardado) return false;
                try {
                    const u = JSON.parse(guardado);
                    const id = u && (u.id ?? u.idUsuario);
                    return Boolean(id);
                } catch (e) {
                    return false;
                }
            }

            if (!tieneSesionValida()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return;
            }

            // Si vuelve desde el historial del navegador (bfcache), revalida la sesión
            window.addEventListener('pageshow', (event) => {
                if (event.persisted && !tieneSesionValida()) {
                    document.documentElement.style.display = 'none';
                    window.location.replace('login.html');
                }
            });
        })();
    </script>

    </script>

    <script>
        // --- Control del menú lateral ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // Obtiene el id numérico del usuario desde localStorage o sessionStorage
        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem('usuarioLogueado') || sessionStorage.getItem('empleados_usuario');
            if (!guardado) return null;
            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? Number(id) : null;
            } catch (e) {
                return null;
            }
        }

        // Limpia datos de sesión y perfil y manda al login
        function cerrarSesion() {
            document.documentElement.style.display = 'none';
            localStorage.removeItem('usuarioLogueado');
            localStorage.removeItem('perfilSeleccionado');
            sessionStorage.removeItem('empleados_usuario');
            sessionStorage.removeItem('idPerfilSeleccionado');
            window.location.replace('login.html');
        }

        // Verifica que siga habiendo sesión activa antes de continuar
        function verificarSesionActiva() {
            if (!obtenerUsuarioSesion()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return false;
            }
            document.documentElement.style.display = '';
            return true;
        }

        // Conectamos los distintos botones de salir (menú lateral, escritorio y móvil)
        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesionPc')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesion')?.addEventListener('click', cerrarSesion);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarSesionActiva();
            }
        });

        // Guardamos el fármaco actual para usarlo al ocultar o editar
        let idMedicamentoActual = null;
        let nombreMedicamentoActual = 'este medicamento';

        // Oculta (borrado lógico) el medicamento en la API previa confirmación 
        async function ocultarFarmaco(idMedicamento, nombre) {
            if (!verificarSesionActiva()) return;
            const idUsuario = obtenerUsuarioSesion();

            const confirmacion = await Swal.fire({
                title: '¿Eliminar medicamento?',
                text: `¿Deseas eliminar "${nombre}" de los medicamentos activos?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#287F89',
                cancelButtonColor: '#6B7280',
                background: '#E1F4F6',
                color: '#222222',
                customClass: {
                    popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                }
            });

            if (!confirmacion.isConfirmed) return;

            try {
                const queryUsuario = idUsuario ? `?idUsuario=${idUsuario}` : '';
                const response = await fetch(`/api/Auth/medicamento/ocultar/${idMedicamento}${queryUsuario}`, {
                    method: 'PUT'
                });
                const resultado = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(resultado.mensaje || resultado.message || 'No se pudo eliminar el medicamento.');
                }

                await Swal.fire({
                    title: '¡Eliminado!',
                    text: `"${nombre}" ha sido eliminado correctamente.`,
                    icon: 'success',
                    confirmButtonText: 'Aceptar',
                    confirmButtonColor: '#287F89',
                    background: '#E1F4F6',
                    color: '#222222',
                    customClass: {
                        popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                    }
                });

                window.location.replace('index.html');
            } catch (error) {
                console.error('Error al ocultar fármaco:', error);
                await Swal.fire({
                    title: 'Error',
                    text: error.message || 'Error al eliminar el medicamento.',
                    icon: 'error',
                    confirmButtonText: 'Aceptar',
                    confirmButtonColor: '#287F89',
                    background: '#E1F4F6',
                    color: '#222222',
                    customClass: {
                        popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                    }
                });
            }
        }

        document.getElementById('btnOcultarFarmaco')?.addEventListener('click', () => {
            if (idMedicamentoActual) {
                ocultarFarmaco(idMedicamentoActual, nombreMedicamentoActual);
            }
        });

        // --- Carga inicial del detalle del fármaco ---
        document.addEventListener("DOMContentLoaded", async () => {
            if (!verificarSesionActiva()) return;

            const idUsuario = obtenerUsuarioSesion();
            // Leer el id del medicamento desde la URL (?id=...)
            const params = new URLSearchParams(window.location.search);
            const idMedicamento = params.get("id");
            idMedicamentoActual = idMedicamento;

            if (!idMedicamento) {
                console.error("No se encontró un ID de medicamento en la URL.");
                alert("No se especificó un medicamento.");
                return;
            }

            try {
                const response = await fetch(`/api/Auth/medicamentos/detalle/${idUsuario}/${idMedicamento}`);

                if (!response.ok) {
                    throw new Error(`Error al obtener los detalles: ${response.statusText}`);
                }

                const data = await response.json();
                console.log("Datos del fármaco cargados:", data);

                // Renderizar la foto o muestra placeholder si no tiene
                const contenedorFoto = document.getElementById("contenedorFoto");
                if (contenedorFoto) {
                    const urlFoto = data.foto || data.Foto;

                    if (urlFoto && urlFoto.trim() !== "" && urlFoto !== "null") {
                        let fuenteFoto = urlFoto;

                        if (!fuenteFoto.startsWith("data:image")) {
                            fuenteFoto = `data:image/png;base64,${fuenteFoto}`;
                        }

                        contenedorFoto.innerHTML = `<img src="${fuenteFoto}" alt="Foto del fármaco" class="w-full h-full object-cover block">`;
                    } else {
                        contenedorFoto.innerHTML = `<span class="text-gray-500 md:text-gray-400 font-bold tracking-widest text-xs md:text-sm uppercase">SIN FOTO</span>`;
                    }
                }

                // Llena campos generales y actualiza el enlace de edición con su id
                const inputNombre = document.getElementById("nombreMedicamento");
                const inputVia = document.getElementById("viaAdministracion");
                const tituloDetalleFarmaco = document.getElementById("tituloDetalleFarmaco");

                if (data.nombreMedicamento) {
                    nombreMedicamentoActual = data.nombreMedicamento;
                }

                if (inputNombre) inputNombre.value = data.nombreMedicamento || "";
                if (inputVia) inputVia.value = data.viaAdministracion || "";
                if (tituloDetalleFarmaco && data.nombreMedicamento) {
                    tituloDetalleFarmaco.textContent = data.nombreMedicamento;
                }

                const btnEditar = document.getElementById("btnIrEditar");
                if (btnEditar) {
                    btnEditar.href = `editar_farmaco.html?id=${idMedicamento}`;
                }

                // Renderiza las tomas agrupadas por día
                const contenedorTomas = document.getElementById("contenedorTomas");
                const listaTomas = data.tomas || [];

                if (contenedorTomas) {
                    contenedorTomas.innerHTML = "";

                    if (listaTomas.length === 0) {
                        contenedorTomas.innerHTML = `<p class="text-gray-500 text-sm">No hay tomas pendientes programadas.</p>`;
                        return;
                    }

                    // Agrupamos las tomas bajo clave YYYY-MM-DD
                    const tomasPorFecha = {};
                    listaTomas.forEach(toma => {
                        const fechaCompleta = toma.fechaHoraProgramada ? new Date(toma.fechaHoraProgramada) : new Date();
                        const anio = fechaCompleta.getFullYear();
                        const mes = String(fechaCompleta.getMonth() + 1).padStart(2, '0');
                        const dia = String(fechaCompleta.getDate()).padStart(2, '0');
                        const fechaKey = `${anio}-${mes}-${dia}`;

                        if (!tomasPorFecha[fechaKey]) {
                            tomasPorFecha[fechaKey] = [];
                        }
                        tomasPorFecha[fechaKey].push(toma);
                    });

                    // Clave de hoy para mostrar "Hoy" en vez de la fecha
                    const hoyObj = new Date();
                    const hoyKey = `${hoyObj.getFullYear()}-${String(hoyObj.getMonth() + 1).padStart(2, '0')}-${String(hoyObj.getDate()).padStart(2, '0')}`;

                    let contadorGlobalToma = 1;
                    // Recorre las fechas en orden cronológico
                    Object.keys(tomasPorFecha).sort().forEach(fechaKey => {
                        const tomasDelDia = tomasPorFecha[fechaKey];

                        let etiquetaFecha = "";
                        if (fechaKey === hoyKey) {
                            etiquetaFecha = "Hoy";
                        } else {
                            const [yyyy, mm, dd] = fechaKey.split('-');
                            const d = new Date(yyyy, mm - 1, dd);
                            etiquetaFecha = d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
                        }

                        // Encabezado del día
                        const headerFechaHTML = `
                                            <div class="flex items-center gap-2 mt-2 mb-1 text-crono-dark font-semibold text-sm border-b border-gray-100 pb-1.5">
                                                <span class="text-base">📅</span> <span class="capitalize">${etiquetaFecha}</span>
                                            </div>
                                        `;
                        contenedorTomas.innerHTML += headerFechaHTML;

                        // Pinta cada toma según su estado (Tomada, ¡TOCA!, Omitida o Pendiente)
                        tomasDelDia.forEach(toma => {
                            let htmlToma = "";
                            const numeroToma = contadorGlobalToma++;
                            const horaToma = toma.hora || '';
                            const estado = toma.estado;

                            if (estado === "Tomada") {
                                htmlToma = `
                                                    <div class="flex items-center justify-between px-3 py-2 rounded-2xl">
                                                        <div class="flex items-center gap-3.5">
                                                            <div class="w-8 h-8 rounded-full bg-[#E5EAEE] text-crono-dark flex items-center justify-center shrink-0">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M5 13l4 4L19 7"></path></svg>
                                                            </div>
                                                            <span class="font-medium text-crono-dark text-sm">Toma ${numeroToma} (${horaToma})</span>
                                                        </div>
                                                        <span class="text-gray-600 text-xs font-semibold">Tomada</span>
                                                    </div>`;
                            } else if (estado === "Toca" || estado === "¡TOCA!") {
                                htmlToma = `
                                                    <div class="flex items-center justify-between bg-[#B9DCE3] px-3.5 py-2.5 rounded-full border border-crono-teal/30">
                                                        <div class="flex items-center gap-3.5">
                                                            <div class="w-8 h-8 rounded-full bg-[#DCECEF] text-crono-dark flex items-center justify-center shrink-0">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                            </div>
                                                            <span class="font-semibold text-crono-dark text-sm">Toma ${numeroToma} (${horaToma})</span>
                                                        </div>
                                                        <span class="text-crono-teal text-xs font-bold">¡TOCA!</span>
                                                    </div>`;
                            } else if (estado === "Omitida") {
                                htmlToma = `
                                                    <div class="flex items-center justify-between px-3 py-2 rounded-2xl opacity-70">
                                                        <div class="flex items-center gap-3.5">
                                                            <div class="w-8 h-8 rounded-full border border-red-400 flex items-center justify-center text-red-500 bg-transparent shrink-0">
                                                                <span class="font-bold text-xs">✕</span>
                                                            </div>
                                                            <span class="font-medium text-gray-600 text-sm">Toma ${numeroToma} (${horaToma})</span>
                                                        </div>
                                                        <span class="text-red-500 text-xs font-semibold">Omitida</span>
                                                    </div>`;
                            } else {
                                htmlToma = `
                                                    <div class="flex items-center justify-between px-3 py-2 rounded-2xl">
                                                        <div class="flex items-center gap-3.5">
                                                            <div class="w-8 h-8 rounded-full bg-[#E5EAEE] text-crono-dark flex items-center justify-center shrink-0">
                                                                <span class="font-bold text-xs">!</span>
                                                            </div>
                                                            <span class="font-medium text-crono-dark text-sm">Toma ${numeroToma} (${horaToma})</span>
                                                        </div>
                                                        <span class="text-gray-500 text-xs font-semibold">Pendiente</span>
                                                    </div>`;
                            }

                            contenedorTomas.innerHTML += htmlToma;
                        });
                    });
                }

            } catch (error) {
                console.error("Error al cargar los detalles del fármaco:", error);
            }
        });
    </script>
</body>
</html>
