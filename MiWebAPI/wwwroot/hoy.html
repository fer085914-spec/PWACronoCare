<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Agenda de Hoy</title>
    <!--
      Corre antes de renderizar el <body> para evitar contenido protegido sino hay sesión activa
    -->
    <script>
        (function () {
            function tieneSesionValida() {
                const guardado = localStorage.getItem('usuarioLogueado') || sessionStorage.getItem('empleados_usuario');
                if (!guardado) return false;
                try {
                    const u = JSON.parse(guardado);
                    // Acepta tanto 'id' como 'idUsuario' para mantener compatibilidad con la respuesta del backend
                    const id = u && (u.id ?? u.idUsuario);
                    return Boolean(id);
                } catch (e) {
                    return false;
                }
            }

            if (!tieneSesionValida()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return;
            }

            window.addEventListener('pageshow', (event) => {
                if (event.persisted && !tieneSesionValida()) {
                    document.documentElement.style.display = 'none';
                    window.location.replace('login.html');
                }
            });
        })();
    </script>
    <!-- Tailwind CSS y configuración de colores propios de CronoCare -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden flex flex-col text-crono-dark">

    <!-- Menú lateral deslizable -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 bg-crono-blue text-white flex justify-between items-center">

            <button id="closeSidebar" class="text-white hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex flex-col p-6 gap-5 text-sm">
            <a href="index.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-lg">🏠</span> Inicio
            </a>
            <!-- Vista activa en el menú -->
            <a href="hoy.html" class="text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-lg">📅</span> Agenda de Hoy
            </a>
            <a href="perfiles.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-lg">👥</span> Perfiles
            </a>
            <a href="nuevo_farmaco.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-lg">➕</span> Nuevo Registro
            </a>
            <a href="listo.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-lg">✅</span> Terminados
            </a>
            <hr>
            <button id="btnCerrarSesionLateral" class="text-left text-red-500 hover:text-red-700 font-semibold flex items-center gap-2">
                <span class="text-lg">🚪</span> Salir
            </button>
        </div>
    </div>

    <!-- Fondo oscuro detrás del menú lateral -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 transition-opacity"></div>

    <div class="w-full min-h-screen relative flex flex-col md:flex-row flex-1">

        <!-- Barra lateral fija para escritorio (visible a partir de md) -->
        <aside class="hidden md:flex md:w-72 md:shrink-0 md:flex-col md:justify-between bg-[#2B7A96] text-white md:min-h-screen md:sticky md:top-0 shadow-md z-20">
            <div class="p-7 flex flex-col">
                <a href="index.html" class="flex items-center gap-3.5 mb-9 pb-4 border-b border-white/15 hover:opacity-95 transition-opacity" title="Ir al inicio">
                    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center overflow-hidden shrink-0 ring-2 ring-white/30">
                        <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
                    </div>
                    <span class="text-2xl font-bold tracking-wide text-white">CronoCare</span>
                </a>

                <nav class="flex flex-col gap-2.5 text-base">
                    <a href="index.html" class="text-white/85 hover:bg-white/10 hover:text-white font-medium px-4 py-3 rounded-full flex items-center gap-3 transition-colors">
                        <span class="w-2 h-2 rounded-full bg-transparent shrink-0"></span>
                        <span>Inicio</span>
                    </a>
                    <!-- Indicador activo en navegación de escritorio -->
                    <a href="hoy.html" class="bg-white/20 border border-white/25 text-white font-semibold px-4 py-3 rounded-full flex items-center gap-3 shadow-2xs transition-colors">
                        <span class="w-2 h-2 rounded-full bg-white shrink-0"></span>
                        <span>Hoy</span>
                    </a>
                    <a href="perfiles.html" class="text-white/85 hover:bg-white/10 hover:text-white font-medium px-4 py-3 rounded-full flex items-center gap-3 transition-colors">
                        <span class="w-2 h-2 rounded-full bg-transparent shrink-0"></span>
                        <span>Perfiles</span>
                    </a>
                    <a href="listo.html" class="text-white/85 hover:bg-white/10 hover:text-white font-medium px-4 py-3 rounded-full flex items-center gap-3 transition-colors">
                        <span class="w-2 h-2 rounded-full bg-transparent shrink-0"></span>
                        <span>Terminados</span>
                    </a>
                    <button type="button" id="btnCerrarSesionPc" class="text-left text-white/85 hover:bg-white/10 hover:text-white font-medium px-4 py-3 rounded-full flex items-center gap-3 transition-colors mt-1">
                        <span class="w-2 h-2 rounded-full bg-transparent shrink-0"></span>
                        <span>Salir</span>
                    </button>
                </nav>
            </div>

            <!-- Acceso para agregar fármaco seleccionando perfil -->
            <div class="p-7">
                <a href="perfiles.html" class="w-full bg-[#1F657D] hover:bg-[#195367] text-white font-semibold py-3 px-4 rounded-full flex items-center justify-center gap-2.5 shadow-sm transition-colors text-sm">
                    <span class="text-xl leading-none font-bold">+</span>
                    <span>Nuevo fármaco</span>
                </a>
            </div>
        </aside>

        <!-- Contenido principal de la agenda -->
        <div class="flex-1 flex flex-col min-w-0">

            <div class="md:hidden bg-[#2B7A96] text-white p-4 shadow-md flex justify-between items-center z-10 w-full">
                <a href="index.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity" title="Ir al inicio">
                    <div class="w-10 h-10 flex items-center justify-center overflow-hidden shadow-sm rounded-full">
                        <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-2xl font-bold tracking-wide">CronoCare</h1>
                </a>
            </div>

            <div class="flex-1 pb-24 md:pb-12 w-full max-w-3xl md:max-w-5xl mx-auto flex flex-col">
                <div class="w-full">
                    <!-- Saludo personalizado con el nombre del usuario autenticado -->
                    <div class="p-6 md:px-10 md:pt-9 pb-5">
                        <h2 class="text-xl md:text-2xl font-bold text-crono-dark">¡Hola <span id="nombreUsuario">_____</span>!</h2>
                        <p class="text-gray-800 md:text-gray-700 mt-1.5 md:text-base font-medium md:font-semibold">Controla tus tomas de hoy</p>
                    </div>

                    <!-- Actualizacion dinámica de las tarjetas de tomas pendientes de hoy -->
                    <div class="px-6 md:px-10 flex flex-col gap-5" id="contenedorTomas">
                    </div>

                    <!-- Estado vacío: se muestra cuando no hay tomas pendientes o ya se atendieron todas -->
                    <div id="mensajeVacio" class="hidden text-center mt-12 px-6">
                        <span class="text-5xl">🎉</span>
                        <h3 class="text-lg md:text-xl font-bold text-gray-700 mt-4">¡Todo listo por hoy!</h3>
                        <p class="text-sm text-gray-500 mt-2">Has despachado todas tus tomas programadas.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="md:hidden fixed bottom-0 w-full h-16 bg-white border-t border-gray-200 flex justify-between items-center px-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[9px] font-bold mt-1">INICIO</span>
        </a>
        <a href="hoy.html" class="flex flex-col items-center text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="text-[9px] font-bold mt-1">HOY</span>
        </a>
        <a href="perfiles.html" class="relative -top-6 bg-crono-teal text-white w-14 h-14 rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-white transition-transform pb-1 z-50">
            +
        </a>
        <a href="listo.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[9px] font-bold mt-1">LISTO</span>
        </a>
        <button id="btnCerrarSesion" class="flex flex-col items-center text-gray-400 hover:text-red-500 w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="text-[9px] font-bold mt-1">SALIR</span>
        </button>
    </div>

    <script>
        // --- Control del menú lateral ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // Extrae el id y nombre del usuario activo desde localStorage o sessionStorage
        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem("usuarioLogueado") || sessionStorage.getItem("empleados_usuario");
            if (!guardado) return null;
            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? { id: Number(id), nombre: u.nombre } : null;
            } catch (e) {
                return null;
            }
        }

        // Comprobar que hay sesión válida antes de operar
        function verificarSesionActiva() {
            if (!obtenerUsuarioSesion()) {
                document.documentElement.style.display = 'none';
                window.location.replace("login.html");
                return false;
            }
            document.documentElement.style.display = '';
            return true;
        }

        // Borra credenciales y selección de perfil en ambos storages y redirige sin historial
        function cerrarSesion() {
            document.documentElement.style.display = 'none';
            localStorage.removeItem("usuarioLogueado");
            localStorage.removeItem("perfilSeleccionado");
            sessionStorage.removeItem("empleados_usuario");
            sessionStorage.removeItem("perfilSeleccionado");
            window.location.replace("login.html");
        }
        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesionPc')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesion')?.addEventListener('click', cerrarSesion);

        // Revalidar la sesión
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarSesionActiva();
            }
        });

        // --- Inicialización de la vista ---
        document.addEventListener("DOMContentLoaded", async () => {
            if (!verificarSesionActiva()) return;
            const usuario = obtenerUsuarioSesion();

            // Mostrar el nombre del usuario en el saludo principal
            const spanNombre = document.getElementById("nombreUsuario");
            if (spanNombre && usuario.nombre) {
                spanNombre.textContent = usuario.nombre;
            }

            await cargarAgendaHoy(usuario.id);
        });

        // Consultar las tomas del día y renderizar solo las que siguen pendientes o toca tomar
        async function cargarAgendaHoy(idUsuario) {
            const contenedor = document.getElementById('contenedorTomas');
            const mensajeVacio = document.getElementById('mensajeVacio');

            try {
                const response = await fetch(`/api/Auth/agenda/hoy/${idUsuario}`);
                if (!response.ok) throw new Error("Error al obtener la agenda");

                const tomas = await response.json();
                contenedor.innerHTML = "";
                mensajeVacio.classList.add('hidden');

                // Filtrar las tomas que aún no han sido marcadas como 'Tomada' u 'Omitida'
                const tomasPendientes = tomas.filter(t => t.estadoToma === "Pendiente" || t.estadoToma === "Toca");

                if (tomasPendientes.length === 0) {
                    mensajeVacio.classList.remove('hidden');
                    return;
                }

                tomasPendientes.forEach(toma => {
                    // Formatear la fecha/hora programada en formato de 2 dígitos (hora y minutos)
                    const horaFormateada = new Date(toma.fechaHoraProgramada).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const tarjetaHTML = `
                                            <div class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-sm border border-crono-teal/40 md:border-gray-100 relative transition-all duration-500 ease-in-out" id="toma-${toma.idToma}">
                                                <!-- Datos del perfil asociado a la toma -->
                                                <div class="mb-3.5 pb-2.5 border-b border-gray-200 md:border-gray-100 flex items-center justify-between text-xs md:text-sm text-gray-500">
                                                    <span>${toma.perfil.nombre} (${toma.perfil.relacion})</span>
                                                    <span>Fecha nacimiento: ${toma.perfil.fechaNacimiento}</span>
                                                </div>

                                                <div class="flex items-start gap-4">
                                                    <div class="w-12 h-12 md:w-14 md:h-14 bg-crono-light rounded-full flex items-center justify-center shrink-0">
                                                        <svg class="w-6 h-6 md:w-7 md:h-7 text-crono-teal" fill="currentColor" viewBox="0 0 24 24">
                                                            <path d="M17.34 6.66a5.5 5.5 0 00-7.78 0L6.66 9.56a5.5 5.5 0 000 7.78 5.5 5.5 0 007.78 0l2.9-2.9a5.5 5.5 0 000-7.78zm-4.24 6.36l-2.12-2.12m5.66-2.12L13.1 5.24"></path>
                                                        </svg>
                                                    </div>
                                                    <div class="flex-1 pr-20">
                                                        <h3 class="font-bold text-crono-dark text-sm md:text-base leading-tight uppercase">${toma.nombreMedicamento}</h3>
                                                        <p class="text-xs md:text-sm text-gray-600 mt-1">Hora de la toma: <span class="font-semibold text-crono-blue">${horaFormateada} hrs</span></p>
                                                    </div>
                                                </div>

                                                <!-- Botones de acción rápida: marcar como 'Omitida' (tacha) o 'Tomada' (palomita) -->
                                                <div class="absolute bottom-5 right-5 flex gap-3">
                                                    <!-- Tacha roja: registra la toma como omitida -->
                                                    <button type="button" onclick="actualizarEstadoToma(${toma.idToma}, 'Omitida')" class="w-8 h-8 rounded-full border-2 border-red-500 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors" title="No tomada / Omitida">
                                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                                                    </button>
                                                    <!-- Palomita verde: registra la toma como completada -->
                                                    <button type="button" onclick="actualizarEstadoToma(${toma.idToma}, 'Tomada')" class="w-8 h-8 rounded-full border-2 border-green-500 text-green-500 flex items-center justify-center hover:bg-green-500 hover:text-white transition-colors" title="Tomada">
                                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        `;
                    contenedor.innerHTML += tarjetaHTML;
                });

            } catch (error) {
                console.error("Error al cargar la agenda de hoy:", error);
                contenedor.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm text-center"><p class="text-red-500">Error al cargar las tomas de hoy.</p></div>`;
            }
        }

        // Envíar el nuevo estado ('Tomada' u 'Omitida') y retirar la tarjeta con animación
        async function actualizarEstadoToma(idToma, nuevoEstado) {
            if (!verificarSesionActiva()) return;
            const usuario = obtenerUsuarioSesion();

            const tarjeta = document.getElementById(`toma-${idToma}`);

            try {
                const response = await fetch('/api/Auth/agenda/actualizar-toma', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idUsuario: usuario.id,
                        idToma: idToma,
                        nuevoEstado: nuevoEstado
                    })
                });

                if (!response.ok) throw new Error("No se pudo actualizar el estado");

                if (tarjeta) {
                    // Desvaner y reducir la tarjeta antes de quitarla
                    tarjeta.style.opacity = '0';
                    tarjeta.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        tarjeta.remove();
                        //  mostramos el mensaje de agenda completada cuando ya no queden tomas
                        const contenedor = document.getElementById('contenedorTomas');
                        if (contenedor && contenedor.children.length === 0) {
                            document.getElementById('mensajeVacio').classList.remove('hidden');
                        }
                    }, 400);
                }
            } catch (error) {
                console.error("Error al actualizar la toma:", error);
                alert("Hubo un error al registrar la acción.");
            }
        }
    </script>
</body>
</html>
