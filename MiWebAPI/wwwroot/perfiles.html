<!DOCTYPE html>

<head>

    <title>CronoCare - Perfiles de Cuidado</title>
    <!--
        Corre antes de renderizar el <body> para evitar contenido protegido sino hay sesión activa
    -->
    <script>
        (function () {
            function tieneSesionValida() {
                const guardado = localStorage.getItem('usuarioLogueado');
                if (!guardado) return false;
                try {
                    const u = JSON.parse(guardado);
                    const id = u && (u.id ?? u.idUsuario);
                    return Boolean(id);
                } catch (e) {
                    return false;
                }
            }

            if (!tieneSesionValida()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return;
            }

            // 'pageshow' con event.persisted === true detecta si la página vuelve desde la BFCache al navegar con Atrás o Adelante
            window.addEventListener('pageshow', (event) => {
                if (event.persisted && !tieneSesionValida()) {
                    document.documentElement.style.display = 'none';
                    window.location.replace('login.html');
                }
            });
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',

                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // --- Constantes y gestión de sesión ---
        const CLAVE_SESION = 'usuarioLogueado';

        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem(CLAVE_SESION);
            if (!guardado) return null;

            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? { id: Number(id), nombre: u.nombre, tipoUso: u.tipoUso } : null;
            } catch (e) {
                return null;
            }
        }

        function verificarSesionActiva() {
            if (!obtenerUsuarioSesion()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return false;
            }
            document.documentElement.style.display = '';
            return true;
        }

        // Limpiar credenciales y perfil seleccionado en ambos storages antes de redirigir al login
        function cerrarSesion() {
            document.documentElement.style.display = 'none';
            localStorage.removeItem(CLAVE_SESION);
            sessionStorage.removeItem(CLAVE_SESION);
            sessionStorage.removeItem('perfilSeleccionado');
            window.location.replace('login.html');
        }

        document.getElementById('btnCerrarSesionPc')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesion')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarSesionActiva();
            }
        });

        // mostrar alertas
        function mostrarAlertaCrono(titulo, mensaje, tipo = 'info', textoBoton = 'Aceptar') {
            return Swal.fire({
                title: titulo,
                text: mensaje,
                icon: tipo,
                confirmButtonText: textoBoton,
                confirmButtonColor: '#287F89',
                background: '#E1F4F6',
                color: '#222222',
                customClass: {
                    popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                }
            });
        }

        const API = '/api/Auth';

        async function llamarApi(url, opciones) {
            const respuesta = await fetch(url, opciones);
            let datos = null;
            try { datos = await respuesta.json(); } catch (e) { /* sin cuerpo JSON */ }

            if (!respuesta.ok) {
                throw new Error((datos && datos.message) || 'No se pudo completar la solicitud.');
            }
            return datos;
        }

        function crearElemento(etiqueta, clases, texto) {
            const elemento = document.createElement(etiqueta);
            if (clases) elemento.className = clases;
            if (texto !== undefined) elemento.textContent = texto;
            return elemento;
        }

        // Convertir 'YYYY-MM-DD' a 'DD/MM/YYYY'
        function formatearFecha(iso) {
            if (!iso) return '';
            const [anio, mes, dia] = iso.split('-');
            return `${dia}/${mes}/${anio}`;
        }

        let cantidadPerfiles = 0;

        // Reemplazar el listado de perfiles por un bloque de estado vacío o error
        function mostrarMensajeLista(texto) {
            const contenedor = document.getElementById('listaPerfiles');
            contenedor.replaceChildren();

            const caja = crearElemento('div', 'bg-white p-6 rounded-2xl shadow-sm text-center');
            caja.appendChild(crearElemento('p', 'text-gray-500 text-sm', texto));
            contenedor.appendChild(caja);
        }

        // confirmación y elimina el perfil junto con sus medicamentos asociados en el backend
        async function confirmarYOCultarPerfil(perfil) {
            if (!verificarSesionActiva()) return;
            const usuario = obtenerUsuarioSesion();

            const confirmacion = await Swal.fire({
                title: '¿Eliminar perfil?',
                text: `Se eliminará el perfil de ${perfil.nombre} y todos sus medicamentos (activos o concluidos).`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#287F89',
                cancelButtonColor: '#6B7280',
                background: '#E1F4F6',
                color: '#222222',
                customClass: {
                    popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                }
            });

            if (!confirmacion.isConfirmed) return;

            try {
                await llamarApi(`${API}/perfil/ocultar/${usuario.id}/${perfil.idPerfil}`, {
                    method: 'DELETE'
                });

                // Si el perfil eliminado era el que estaba guardado como seleccionado en sesión, se limpia
                const guardadoPerfil = sessionStorage.getItem('perfilSeleccionado');
                if (guardadoPerfil) {
                    try {
                        const actual = JSON.parse(guardadoPerfil);
                        if (Number(actual.idPerfil) === Number(perfil.idPerfil)) {
                            sessionStorage.removeItem('perfilSeleccionado');
                        }
                    } catch (e) {
                        sessionStorage.removeItem('perfilSeleccionado');
                    }
                }

                await cargarPerfiles(usuario.id);

                await mostrarAlertaCrono(
                    '¡Perfil eliminado!',
                    `El perfil de ${perfil.nombre} y sus medicamentos han sido eliminados.`,
                    'success'
                );
            } catch (error) {
                console.error('Error al ocultar perfil:', error);
                await mostrarAlertaCrono(
                    'Error',
                    'No se pudo eliminar el perfil: ' + error.message,
                    'error'
                );
            }
        }

        // tarjeta interactiva de cada perfil con soporte de clic, teclado y botón de eliminar
        function crearTarjetaPerfil(perfil) {
            const tarjeta = crearElemento('div',
                'bg-white p-5 md:px-6 md:py-4 rounded-2xl md:rounded-full shadow-sm border-2 border-crono-teal flex items-center justify-between gap-3 relative cursor-pointer hover:bg-crono-light/20 transition-all');
            tarjeta.tabIndex = 0;
            tarjeta.setAttribute('role', 'button');

            const izquierda = crearElemento('div', 'flex items-center gap-4 min-w-0');
            const avatar = crearElemento('div',
                'w-12 h-12 bg-[#DCEEEF] text-crono-blue rounded-full flex items-center justify-center flex-shrink-0');
            avatar.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>`;
            izquierda.appendChild(avatar);

            const info = crearElemento('div', 'min-w-0');
            const fila = crearElemento('div', 'flex items-center gap-2 flex-wrap');
            fila.appendChild(crearElemento('h3', 'font-bold text-crono-dark text-base md:text-lg truncate', perfil.nombre));
            fila.appendChild(crearElemento('span',
                'bg-crono-teal text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase', perfil.tipoPerfil));
            info.appendChild(fila);
            info.appendChild(crearElemento('p', 'text-xs text-gray-500 mt-0.5',
                `Edad: ${perfil.edad} años | Fecha Nac: ${formatearFecha(perfil.fechaNacimiento)}`));
            izquierda.appendChild(info);

            const derecha = crearElemento('div', 'flex items-center gap-3 flex-shrink-0');
            derecha.appendChild(crearElemento('span', 'text-crono-teal font-bold text-xs md:text-sm hidden md:inline', 'Seleccionar →'));

            const btnEliminar = crearElemento('button',
                'bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-3.5 py-1.5 rounded-full border border-red-200 transition-colors',
                'Eliminar');
            btnEliminar.type = 'button';
            btnEliminar.setAttribute('aria-label', `Eliminar perfil de ${perfil.nombre}`);
            btnEliminar.addEventListener('click', async (e) => {
                e.stopPropagation();
                await confirmarYOCultarPerfil(perfil);
            });

            derecha.appendChild(btnEliminar);

            tarjeta.appendChild(izquierda);
            tarjeta.appendChild(derecha);

            tarjeta.addEventListener('click', () => seleccionarPerfil(perfil));
            tarjeta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    seleccionarPerfil(perfil);
                }
            });

            return tarjeta;
        }

        // obtener los perfiles del usuario y actualizar la lista en pantalla
        async function cargarPerfiles(idUsuario) {
            const contenedor = document.getElementById('listaPerfiles');

            try {
                const perfiles = await llamarApi(`${API}/perfiles/selector/${idUsuario}`);
                cantidadPerfiles = perfiles.length;

                if (perfiles.length === 0) {
                    mostrarMensajeLista('No tienes perfiles creados todavía. Usa el botón "Nuevo perfil" para crear el primero.');
                    return;
                }

                contenedor.replaceChildren();
                perfiles.forEach((perfil) => contenedor.appendChild(crearTarjetaPerfil(perfil)));
            } catch (error) {
                console.error('Error al listar perfiles:', error);
                mostrarMensajeLista('No se pudieron cargar tus perfiles. Recarga la página.');
            }
        }

        // Carga del catálogo de tipos de perfil
        async function cargarTiposPerfil() {
            const select = document.getElementById('tipoPerfilModal');
            if (!select) return;

            try {
                const urlPeticion = `${API}/catalogos/tipos-perfil`;
                console.log("Consultando tipos de perfil en:", urlPeticion);

                const tipos = await llamarApi(urlPeticion);

                select.innerHTML = '<option value="" disabled selected>Selecciona una opción</option>';

                if (!tipos || tipos.length === 0) {
                    console.warn("La API respondió pero la lista llegó vacía.");
                    return;
                }

                tipos.forEach((tipo) => {
                    const opcion = document.createElement('option');
                    opcion.value = tipo.idTipoPerfil;
                    opcion.textContent = tipo.nombre;
                    select.appendChild(opcion);
                });
            } catch (error) {
                console.error('Error al cargar los tipos de perfil:', error);
            }
        }

        // Guardar el perfil elegido en sessionStorage y navegar al formulario de registro de fármaco
        function seleccionarPerfil(perfil) {
            const perfilActivo = {
                idPerfil: perfil.idPerfil,
                nombre: perfil.nombre,
                parentesco: perfil.tipoPerfil
            };
            sessionStorage.setItem('perfilSeleccionado', JSON.stringify(perfilActivo));
            window.location.href = 'nuevo_farmaco.html';
        }

        // --- Inicialización de la vista, avisos por URL y modal de creación ---
        document.addEventListener('DOMContentLoaded', async () => {
            if (!verificarSesionActiva()) return;
            const usuario = obtenerUsuarioSesion();

            // Si venimos redirigidos porque faltaba elegir un perfil, muestra el aviso
            const params = new URLSearchParams(window.location.search);
            const solicitarSeleccion =
                params.get('sinPerfil') === '1' ||
                params.get('aviso') === 'seleccionar' ||
                params.get('motivo') === 'perfil';

            if (solicitarSeleccion) {
                await mostrarAlertaCrono(
                    'Perfil de cuidado requerido',
                    'Debes seleccionar un perfil de cuidado antes de registrar un fármaco.',
                    'warning',
                    'Entendido'
                );

                // Limpia la query string sin recargar para que un refresh posterior no repita el aviso
                const urlLimpia = window.location.pathname;
                window.history.replaceState({}, document.title, urlLimpia);
            }

            cargarPerfiles(usuario.id);
            cargarTiposPerfil();

            const modal = document.getElementById('modalPerfil');
            const btnAbrir = document.getElementById('btnAbrirModalNuevoPerfil');
            const btnCerrar = document.getElementById('btnCerrarModal');
            const btnCancelar = document.getElementById('btnCancelarModal');
            const formNuevoPerfil = document.getElementById('formNuevoPerfil');
            const btnGuardar = document.getElementById('btnGuardarPerfil');
            const selectTipo = document.getElementById('tipoPerfilModal');
            const campoFecha = document.getElementById('fechaNacimientoModal');

            // Limita la fecha máxima de nacimiento a "hoy" en hora local
            const ahora = new Date();
            campoFecha.max = new Date(ahora.getTime() - ahora.getTimezoneOffset() * 60000)
                .toISOString().slice(0, 10);

            if (btnAbrir) {
                btnAbrir.addEventListener('click', () => {
                    // Si aún no hay perfiles y el usuario no registró cuenta como "cuidador", se sugiere "propio"
                    if (cantidadPerfiles === 0 && usuario.tipoUso !== 'cuidador') {
                        const propio = Array.from(selectTipo.options)
                            .find((o) => o.textContent.trim().toLowerCase() === 'propio');
                        if (propio) selectTipo.value = propio.value;
                    }
                    modal.classList.remove('hidden');
                });
            }
            if (btnCerrar) btnCerrar.addEventListener('click', () => modal.classList.add('hidden'));
            if (btnCancelar) btnCancelar.addEventListener('click', () => modal.classList.add('hidden'));

            if (formNuevoPerfil) {
                formNuevoPerfil.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!verificarSesionActiva()) return;

                    const nombre = document.getElementById('nombrePacienteModal').value.trim();

                    const nuevoPerfil = {
                        idUsuario: usuario.id,
                        idTipoPerfil: Number(selectTipo.value),
                        nombre: nombre,
                        fechaNacimiento: campoFecha.value
                    };

                    btnGuardar.disabled = true;

                    try {
                        await llamarApi(`${API}/perfil/crear`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(nuevoPerfil)
                        });

                        modal.classList.add('hidden');
                        formNuevoPerfil.reset();
                        await cargarPerfiles(usuario.id);

                        await mostrarAlertaCrono(
                            '¡Perfil creado!',
                            `¡Perfil de ${nombre} guardado con éxito!`,
                            'success'
                        );
                    } catch (error) {
                        console.error('Error al guardar el perfil:', error);
                        await mostrarAlertaCrono(
                            'Error',
                            'No se pudo guardar el perfil: ' + error.message,
                            'error'
                        );
                    } finally {
                        btnGuardar.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
