<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Medicamentos Terminados</title>
    <!--
        Corre antes de renderizar el <body> para evitar contenido protegido sino hay sesión activa
    -->
    <script>
        (function () {
            function tieneSesionValida() {
                const guardado = localStorage.getItem('usuarioLogueado') || sessionStorage.getItem('empleados_usuario');
                if (!guardado) return false;
                try {
                    const u = JSON.parse(guardado);
                    const id = u && (u.id ?? u.idUsuario);
                    return Boolean(id);
                } catch (e) {
                    return false;
                }
            }

            if (!tieneSesionValida()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return;
            }

            window.addEventListener('pageshow', (event) => {
                if (event.persisted && !tieneSesionValida()) {
                    document.documentElement.style.display = 'none';
                    window.location.replace('login.html');
                }
            });
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }

        }
    </script>

            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="text-[9px] font-bold mt-1">SALIR</span>

    <script>
        // --- Control del menú lateral deslizable ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // Obtiene y valida el ID numérico del usuario desde localStorage o sessionStorage
        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem("usuarioLogueado") || sessionStorage.getItem("empleados_usuario");
            if (!guardado) return null;
            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? Number(id) : null;
            } catch (e) {
                return null;
            }
        }

        // Revalida la sesión
        function verificarSesionActiva() {
            if (!obtenerUsuarioSesion()) {
                document.documentElement.style.display = 'none';
                window.location.replace("login.html");
                return false;
            }
            document.documentElement.style.display = '';
            return true;
        }

        // Limpia sesión y claves de perfil de ambos storages y sustituye el historial
        function cerrarSesion() {
            document.documentElement.style.display = 'none';
            localStorage.removeItem("usuarioLogueado");
            localStorage.removeItem("perfilSeleccionado");
            sessionStorage.removeItem("empleados_usuario");
            sessionStorage.removeItem("idPerfilSeleccionado");
            window.location.replace("login.html");
        }
        document.getElementById('btnCerrarSesionLateral').addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesionPc')?.addEventListener('click', cerrarSesion);
        const btnSalirMovil = document.getElementById('btnCerrarSesion');
        if (btnSalirMovil) btnSalirMovil.addEventListener('click', cerrarSesion);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarSesionActiva();
            }
        });

        // bloque informativo cuando el usuario no tiene medicamentos concluidos aún
        function renderizarEstadoVacio(contenedor) {
            contenedor.innerHTML = `
                                    <div class="bg-white/80 md:bg-white rounded-2xl md:rounded-3xl p-8 text-center border border-gray-200 md:border-gray-100 shadow-sm flex flex-col items-center justify-center gap-3">
                                        <div class="w-14 h-14 bg-crono-light rounded-full flex items-center justify-center text-crono-teal text-2xl">
                                            ✅
                                        </div>
                                        <h3 class="font-bold text-gray-700 text-base md:text-lg">No hay historial aún</h3>
                                        <p class="text-gray-500 text-xs md:text-sm max-w-sm">Los tratamientos médicos concluidos aparecerán automáticamente aquí.</p>
                                    </div>`;
        }

        // --- Carga del historial ---
        document.addEventListener("DOMContentLoaded", async () => {
            if (!verificarSesionActiva()) return;
            const idUsuario = obtenerUsuarioSesion();

            await cargarMedicamentosConcluidos(idUsuario);
        });

        // Consulta los medicamentos concluidos del usuario y muestra sus tarjetas con acción de ocultar
        async function cargarMedicamentosConcluidos(idUsuario) {
            const contenedor = document.getElementById("contenedorConcluidos");

            try {
                const response = await fetch(`/api/Auth/medicamentos/concluidos/usuario/${idUsuario}`);

                if (response.status === 404) {
                    contenedor.innerHTML = "";
                    renderizarEstadoVacio(contenedor);
                    return;
                }

                if (!response.ok) {
                    throw new Error("Error al obtener los medicamentos concluidos.");
                }

                const data = await response.json();
                const lista = Array.isArray(data) ? data : (data.medicamentos || data.data || []);

                contenedor.innerHTML = "";

                if (lista.length === 0) {
                    renderizarEstadoVacio(contenedor);
                    return;
                }

                lista.forEach(med => {
                    const idMed = med.idMedicamento ?? med.ID_MEDICAMENTO ?? med.id;

                    // Si el medicamento tiene foto, muestra su miniatura, si no el ícono de cápsula
                    const iconoOImg = med.foto
                        ? `<img src="${med.foto}" alt="${med.nombreMedicamento}" class="w-full h-full object-cover rounded-full">`
                        : `<svg class="w-5 h-5 md:w-6 md:h-6 text-crono-teal md:text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M17.34 6.66a5.5 5.5 0 00-7.78 0L6.66 9.56a5.5 5.5 0 000 7.78 5.5 5.5 0 007.78 0l2.9-2.9a5.5 5.5 0 000-7.78zm-4.24 6.36l-2.12-2.12m5.66-2.12L13.1 5.24"></path></svg>`;

                    // datos del perfil al que pertenecía el tratamiento
                    const infoPerfil = med.perfil
                        ? `<div class="mb-3 pb-2 border-b border-gray-100 flex items-center justify-between text-xs text-gray-500">
                                               <span>${med.perfil.nombre || ''} ${med.perfil.relacion ? `(${med.perfil.relacion})` : ''}</span>
                                               ${med.perfil.fechaNacimiento ? `<span>Fecha nacimiento: ${med.perfil.fechaNacimiento}</span>` : ''}
                                           </div>`
                        : '';

                    const card = document.createElement("div");
                    card.className = "bg-white/70 md:bg-white rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-sm border border-gray-200 md:border-gray-100 relative hover:shadow-md transition-shadow group";

                    card.innerHTML = `
                                            ${infoPerfil}
                                            <!-- Zona principal clickeable para abrir el desglose en finalizado.html -->
                                            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='finalizado.html?id=${idMed}'">
                                                <div class="w-11 h-11 md:w-12 md:h-12 bg-crono-light md:bg-gray-100 rounded-full flex items-center justify-center shrink-0 overflow-hidden group-hover:bg-gray-200 transition-colors">
                                                    ${iconoOImg}
                                                </div>
                                                <div class="flex-1 pr-12">
                                                    <h3 class="font-bold text-gray-700 md:text-crono-dark text-base md:text-lg leading-tight group-hover:text-crono-teal transition-colors uppercase">${med.nombreMedicamento}</h3>
                                                    <p class="text-xs text-gray-500 mt-1">Concluyó el: ${med.fechaFin} | Vía: ${med.viaAdministracion}</p>
                                                    <p class="text-xs text-crono-teal font-semibold mt-0.5">Tomas tomadas: ${med.tomasTomadas} de ${med.tomasTotales}</p>
                                                </div>
                                            </div>
                                            <!-- Botón de papelera para ocultar el registro del historial -->
                                            <div class="absolute bottom-4 right-4 flex gap-3">
                                                <button type="button" class="text-gray-400 hover:text-red-500 transition-colors z-10 btn-ocultar" title="Ocultar registro">
                                                    <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                </button>
                                            </div>
                                        `;

                    const btnOcultar = card.querySelector(".btn-ocultar");
                    btnOcultar.addEventListener("click", async (e) => {
                        e.stopPropagation();

                        const confirmacion = await Swal.fire({
                            title: "¿Eliminar medicamento?",
                            text: `¿Deseas eliminar "${med.nombreMedicamento}" del historial?`,
                            icon: "warning",
                            showCancelButton: true,
                            confirmButtonText: "Sí, eliminar",
                            cancelButtonText: "Cancelar",
                            confirmButtonColor: "#287F89",
                            cancelButtonColor: "#6B7280",
                            background: "#E1F4F6",
                            color: "#222222",
                            customClass: {
                                popup: "rounded-3xl shadow-2xl border-2 border-[#287F89]"
                            }
                        });

                        if (!confirmacion.isConfirmed) return;

                        try {
                            const res = await fetch(`/api/Auth/medicamento/ocultar/${idMed}`, {
                                method: 'PUT'
                            });

                            if (!res.ok) throw new Error("No se pudo eliminar el medicamento.");

                            card.style.transition = "all 0.3s ease";
                            card.style.opacity = "0";
                            card.style.transform = "scale(0.95)";
                            setTimeout(() => {
                                card.remove();

                                if (contenedor.children.length === 0) {
                                    renderizarEstadoVacio(contenedor);
                                }
                            }, 300);

                        } catch (error) {
                            console.error("Error:", error);
                            Swal.fire({
                                title: "Error",
                                text: "Hubo un error al intentar eliminar el registro.",
                                icon: "error",
                                confirmButtonText: "Aceptar",
                                confirmButtonColor: "#287F89",
                                background: "#E1F4F6",
                                color: "#222222",
                                customClass: {
                                    popup: "rounded-3xl shadow-2xl border-2 border-[#287F89]"
                                }
                            });
                        }
                    });

                    contenedor.appendChild(card);
                });

            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = `
                                        <div class="bg-red-50 rounded-2xl p-6 text-center border border-red-200">
                                            <p class="text-red-500 font-semibold text-sm">Error al cargar el historial de medicamentos.</p>
                                        </div>`;
            }
        }
    </script>
</body>
