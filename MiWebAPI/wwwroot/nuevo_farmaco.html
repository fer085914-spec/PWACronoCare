<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Registrar Fármaco</title>
    <!--
        Corre antes de renderizar el <body> para evitar contenido protegido sino hay sesión activa
    -->
    <script>
        (function () {
            function tieneSesionValida() {
                const guardado = localStorage.getItem('usuarioLogueado');
                if (!guardado) return false;
                try {
                    const u = JSON.parse(guardado);
                    const id = u && (u.id ?? u.idUsuario);
                    return Boolean(id);
                } catch (e) {
                    return false;
                }
            }

            if (!tieneSesionValida()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return;
            }

            // 'pageshow' con event.persisted === true detecta cuando la vista se restaura desde la BFCache al navegar con Atrás/Adelante
            window.addEventListener('pageshow', (event) => {
                if (event.persisted && !tieneSesionValida()) {
                    document.documentElement.style.display = 'none';
                    window.location.replace('login.html');
                }
            });
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden flex flex-col text-crono-dark">

    <!-- Menú lateral deslizable-->

    <div class="w-full min-h-screen relative flex flex-col md:flex-row flex-1">

        <div class="flex-1 flex flex-col min-w-0">

            <div class="md:hidden bg-[#2B7A96] text-white p-4 shadow-md flex justify-between items-center z-10 w-full">
                <a href="index.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity" title="Ir al inicio">

            <div class="flex-1 pb-24 md:pb-14 w-full max-w-xl md:max-w-4xl mx-auto flex flex-col p-6 md:px-12 md:pt-9 mt-4 md:mt-0">

                <div class="flex items-center justify-center mb-5 md:mb-6 w-full">
                    <h2 class="text-lg md:text-2xl font-bold text-center text-crono-dark tracking-wide uppercase">REGISTRAR FÁRMACO</h2>

                <div id="badgePerfilActivo" class="bg-white/85 md:bg-white border border-crono-teal/30 px-4 py-3 md:px-7 md:py-4 rounded-2xl md:rounded-full mb-6 flex items-center justify-between shadow-2xs">

                        <div class="min-w-0">
                            <p class="text-[10px] md:text-xs text-gray-500 font-bold uppercase tracking-wider leading-tight">ASIGNADO A:</p>
                            <p id="nombrePerfilSeleccionado" class="text-xs md:text-base font-bold text-crono-dark uppercase truncate mt-0.5">PERFIL SELECCIONADO</p>
                        </div>
                    </div>
                    <a href="perfiles.html" class="text-xs md:text-sm font-bold text-white bg-crono-teal/80 hover:bg-crono-blue transition-colors px-4 py-2 rounded-full shadow-2xs shrink-0 ml-3">

                <!-- Vista de la fotografía capturada en tomar_fotografia.html -->

                    <div class="relative w-full h-48 bg-gray-100 rounded-2xl overflow-hidden border border-gray-200">
                        <img id="imgPreviewFoto" src="" alt="Vista previa del fármaco" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 left-2 bg-black/65 text-white text-[11px] font-semibold px-3 py-1 rounded-full">
                            📷 Fotografía adjuntada
                        </span>
                        <button type="button" id="btnQuitarFoto" class="absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow transition-colors">
                            Quitar

                    </div>
                </div>

                <!-- Formulario para crear un nuevo esquema -->
                <form id="formFarmaco" class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-5 md:gap-6">

                    <div>
                        <label class="block text-sm font-bold text-crono-dark mb-2 pl-1">Nombre del medicamento:</label>
                        <input type="text" id="nombreMedicamento" class="w-full bg-[#DCE6EA] md:bg-white border border-transparent md:border-gray-300 rounded-full px-4 md:px-5 py-2.5 md:py-3 text-sm text-crono-dark focus:outline-none focus:border-crono-teal transition-colors" placeholder="Ej. Paracetamol" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-crono-dark mb-2 pl-1">Vía de administración:</label>
                        <select id="viaAdmin" class="w-full bg-[#DCE6EA] md:bg-white border border-transparent md:border-gray-300 rounded-full px-4 md:px-5 py-2.5 md:py-3 text-sm focus:outline-none focus:border-crono-teal text-crono-dark transition-colors" required>
                            <option value="" disabled selected>Cargando vías...</option>
                        </select>
                    </div>

                    <div class="flex gap-4 md:gap-6">
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-crono-dark mb-2 pl-1">Intervalo (horas):</label>
                            <input type="number" id="intervalo" min="1" max="24" class="w-full bg-[#DCE6EA] md:bg-white border border-transparent md:border-gray-300 rounded-full px-4 py-2.5 md:py-3 text-sm text-center font-semibold text-crono-dark focus:outline-none focus:border-crono-teal transition-colors" placeholder="--" required>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-crono-dark mb-2 pl-1">Duración (días):</label>
                            <input type="number" id="duracion" min="1" class="w-full bg-[#DCE6EA] md:bg-white border border-transparent md:border-gray-300 rounded-full px-4 py-2.5 md:py-3 text-sm text-center font-semibold text-crono-dark focus:outline-none focus:border-crono-teal transition-colors" placeholder="--" required>
                        </div>
                    </div>

                    <div class="pt-1">
                        <label class="block text-sm font-bold text-crono-dark mb-2 pl-1 text-center">Hora de la primera toma:</label>
                        <div class="flex justify-center">
                            <input type="time" id="horaToma" class="bg-[#DCE6EA] md:bg-white border border-transparent md:border-gray-300 rounded-full px-6 md:px-8 py-2.5 text-center font-bold text-sm md:text-base text-crono-dark focus:outline-none focus:border-crono-teal transition-colors" required>
                        </div>
                    </div>

                    <!-- captura fotográfica, descarte y envío del formulario -->
                    <div class="flex flex-col gap-3.5 mt-3">
                        <a href="tomar_fotografia.html" class="w-full bg-crono-teal text-white font-bold py-3 md:py-3.5 rounded-full hover:bg-crono-blue transition-colors shadow-xs text-xs md:text-sm tracking-wider block text-center uppercase">
                            TOMAR FOTOGRAFÍA
                        </a>
                        <div class="flex gap-3 md:gap-4">
                            <button type="button" id="btnCancelarRegistro" class="w-1/2 bg-[#C8CED2] text-crono-dark font-bold py-3 md:py-3.5 rounded-full hover:bg-gray-300 transition-colors text-xs md:text-sm tracking-wider uppercase">
                                CANCELAR
                            </button>
                            <button type="submit" id="btnGuardar" class="w-1/2 bg-crono-blue text-white font-bold py-3 md:py-3.5 rounded-full hover:bg-[#1F5E80] transition-colors shadow-xs text-xs md:text-sm tracking-wider uppercase">
                                GUARDAR
                            </button>
                        </div>
                    </div>

                    <div id="mensajeAlerta" class="hidden text-center font-semibold mt-2 text-sm"></div>
                </form>
            </div>
        </div>
    </div>

    <div class="md:hidden fixed bottom-0 w-full h-16 bg-white border-t border-gray-200 flex justify-between items-center px-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[9px] font-bold mt-1">INICIO</span>

        <a href="hoy.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="text-[9px] font-bold mt-1">HOY</span>
        </a>
        <a href="listo.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[9px] font-bold mt-1">LISTO</span>
        </a>
        <button type="button" id="btnCerrarSesion" class="flex flex-col items-center text-gray-400 hover:text-red-500 w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="text-[9px] font-bold mt-1">SALIR</span>
        </button>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // --- Constantes y helpers de sesión ---
        const CLAVE_SESION = 'usuarioLogueado';

        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem(CLAVE_SESION);
            if (!guardado) return null;

            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? { id: Number(id), nombre: u.nombre, tipoUso: u.tipoUso } : null;
            } catch (e) {
                return null;
            }
        }

        function verificarSesionActiva() {
            if (!obtenerUsuarioSesion()) {
                document.documentElement.style.display = 'none';
                window.location.replace('login.html');
                return false;
            }
            document.documentElement.style.display = '';
            return true;
        }

        // Limpiar la sesión y los datos temporales del flujo (perfil y foto) antes de ir al login
        function cerrarSesion() {
            document.documentElement.style.display = 'none';
            localStorage.removeItem(CLAVE_SESION);
            sessionStorage.removeItem('perfilSeleccionado');
            sessionStorage.removeItem('fotoMedicamentoTemp');
            window.location.replace('login.html');
        }

        document.getElementById('btnCerrarSesionPc')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesion')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                verificarSesionActiva();
            }
        });

        const API = '/api/Auth';

        async function llamarApi(url, opciones) {
            const respuesta = await fetch(url, opciones);
            let datos = null;
            try { datos = await respuesta.json(); } catch (e) { /* sin cuerpo JSON */ }

            if (!respuesta.ok) {
                throw new Error((datos && datos.message) || 'No se pudo completar la solicitud.');
            }
            return datos;
        }

        // Obtiene las vías de administración desde el catálogo
        async function cargarViasAdministracion() {
            const selectVia = document.getElementById('viaAdmin');
            if (!selectVia) return;

            try {
                const vias = await llamarApi(`${API}/catalogos/vias-administracion`);
                selectVia.innerHTML = '<option value="" disabled selected>Seleccionar</option>';
                vias.forEach(via => {
                    const opcion = document.createElement('option');
                    opcion.value = via.idVia;
                    opcion.textContent = via.nombre;
                    selectVia.appendChild(opcion);
                });
            } catch (error) {
                console.error("Error al cargar vías:", error);
                selectVia.innerHTML = '<option value="" disabled selected>Error al cargar vías</option>';
            }
        }

        // Estado en memoria del usuario autenticado y del perfil de cuidado al que se asignará el fármaco
        let usuarioActual = null;
        let perfilActivo = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!verificarSesionActiva()) return;
            usuarioActual = obtenerUsuarioSesion();

            cargarViasAdministracion();

            // validacion de asociaciòn a un perfil de cuidado 
            const perfilGuardado = sessionStorage.getItem('perfilSeleccionado');
            const etiquetaNombre = document.getElementById('nombrePerfilSeleccionado');

            if (!perfilGuardado) {
                alert("Debes seleccionar un perfil de cuidado antes de registrar un fármaco.");
                window.location.replace("perfiles.html");
                return;
            }

            try {
                perfilActivo = JSON.parse(perfilGuardado);
                if (etiquetaNombre) {
                    etiquetaNombre.textContent = `${perfilActivo.nombre} (${perfilActivo.parentesco || perfilActivo.tipoPerfil})`;
                }
            } catch (e) {
                console.error("Error al leer el perfil seleccionado", e);
                window.location.replace("perfiles.html");
            }

            // Si el usuario regresó desde tomar_fotografia.html con una foto capturada, muestra su vista previa
            const fotoTemporal = sessionStorage.getItem('fotoMedicamentoTemp');
            const contenedorPreview = document.getElementById('contenedorPreviewFoto');
            const imgPreview = document.getElementById('imgPreviewFoto');
            if (fotoTemporal && contenedorPreview && imgPreview) {
                imgPreview.src = fotoTemporal;
                contenedorPreview.classList.remove('hidden');
            }

            // Permite descartar la foto temporal sin salir del formulario
            document.getElementById('btnQuitarFoto')?.addEventListener('click', () => {
                sessionStorage.removeItem('fotoMedicamentoTemp');
                if (imgPreview) imgPreview.src = '';
                if (contenedorPreview) contenedorPreview.classList.add('hidden');
            });

            // Confirmacion antes de descartar el alta y limpia la foto temporal si acepta
            document.getElementById('btnCancelarRegistro')?.addEventListener('click', async () => {
                const confirmacion = await Swal.fire({
                    title: '¿Descartar fármaco?',
                    text: 'Se perderán los datos ingresados para este nuevo medicamento.',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, descartar',
                    cancelButtonText: 'No',
                    confirmButtonColor: '#287F89',
                    cancelButtonColor: '#6B7280',
                    background: '#E1F4F6',
                    color: '#222222',
                    customClass: {
                        popup: 'rounded-3xl shadow-2xl border-2 border-[#287F89]'
                    }
                });

                if (confirmacion.isConfirmed) {
                    sessionStorage.removeItem('fotoMedicamentoTemp');
                    window.location.replace('index.html');
                }
            });
        });

        // --- Envío del formulario para crear el fármaco y generar su calendario de tomas ---
        document.getElementById('formFarmaco').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!verificarSesionActiva()) return;
            const btnGuardar = document.getElementById('btnGuardar');
            const mensajeAlerta = document.getElementById('mensajeAlerta');

            if (!usuarioActual || !perfilActivo) {
                alert("Faltan datos de sesión o perfil. Por favor, vuelve a iniciar sesión.");
                window.location.replace("login.html");
                return;
            }

            // Bloqueo el botón durante la petición para evitar duplicados
            btnGuardar.disabled = true;
            btnGuardar.textContent = "GUARDANDO...";
            mensajeAlerta.classList.add("hidden");

            const fotoCapturada = sessionStorage.getItem('fotoMedicamentoTemp') || null;

            const nuevoMedicamento = {
                idUsuario: usuarioActual.id,
                idPerfil: Number(perfilActivo.idPerfil),
                idVia: Number(document.getElementById('viaAdmin').value),
                nombreMedicamento: document.getElementById('nombreMedicamento').value.trim(),
                foto: fotoCapturada,
                intervaloHoras: parseInt(document.getElementById('intervalo').value),
                duracionDias: parseInt(document.getElementById('duracion').value),
                horaInicio: document.getElementById('horaToma').value,
                fechaInicio: null
            };

            try {
                await llamarApi(`${API}/medicamento/crear`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoMedicamento)
                });

                // Limpiar la foto una vez registrada en el backend
                sessionStorage.removeItem('fotoMedicamentoTemp');

                mensajeAlerta.textContent = "¡Fármaco guardado correctamente!";
                mensajeAlerta.className = "text-center font-bold mt-3 text-sm text-green-600 block";

                setTimeout(() => window.location.replace("index.html"), 1000);
            } catch (error) {
                console.error("Error:", error);
                mensajeAlerta.textContent = error.message;
                mensajeAlerta.className = "text-center font-bold mt-3 text-sm text-red-500 block";
            } finally {
                // Restaurar el botón aunque ocurra un error en la petición
                btnGuardar.disabled = false;
                btnGuardar.textContent = "GUARDAR";
            }
        });
    </script>
</body>
