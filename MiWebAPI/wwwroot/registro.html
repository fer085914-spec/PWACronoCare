<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>

    <style>
        @media (max-width: 767px) {
            body.pc-custom-bg {
                background-color: #E1F4F6;
            }
        }

        @media (min-width: 768px) {
            body.pc-custom-bg {
                background-color: #B9D4DC !important;
                background-image: url('/Images/Ffondo.png') !important;
                background-size: cover !important;
                background-position: center !important;
                background-repeat: no-repeat !important;
            }

            .pc-registro-split {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 0 !important;
                align-items: stretch !important;
                max-width: 920px !important;
                background-color: #FFFFFF !important;
                border-radius: 24px !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15) !important;
                overflow: hidden !important;
            }

            .pc-panel-azul {
                display: flex !important;
                background-color: #27749C !important;
                border-radius: 0 !important;
                box-shadow: none !important;
            }

            .pc-panel-blanco {
                background-color: #FFFFFF !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 36px 44px !important;
            }
        }
    </style>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light pc-custom-bg font-sans flex flex-col justify-center overflow-x-hidden">

    <div class="w-full max-w-6xl mx-auto grid grid-cols-1 items-center px-4 md:px-0 py-4 md:py-0 gap-8 md:gap-0 pc-registro-split">

        <div class="hidden flex-col items-center justify-center text-white px-8 py-12 text-center pc-panel-azul">
            <div class="w-40 h-40 lg:w-44 lg:h-44 flex items-center justify-center overflow-hidden mb-5">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
            </div>
            <p class="text-base font-medium leading-relaxed max-w-xs text-white">
                Tu asistente para el control y seguimiento de medicamentos
            </p>
        </div>

        <div class="flex flex-col items-start justify-center w-full max-w-md md:max-w-none mx-auto pc-panel-blanco">

            <div class="flex md:hidden items-center gap-3 mb-3.5 px-3.5 py-2 rounded-2xl bg-crono-blue/90 shadow-xs w-full">
                <div class="w-11 h-11 rounded-full bg-white/15 flex items-center justify-center overflow-hidden shrink-0">
                    <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
                </div>
                <span class="text-lg font-bold tracking-wide text-white">CronoCare</span>
            </div>

            <div class="flex flex-col items-start mb-3 md:mb-5 text-left w-full border-l-4 border-crono-blue md:border-none pl-3 md:pl-0">
                <h2 class="text-xl md:text-2xl font-bold text-crono-blue md:text-crono-dark mb-0.5 md:mb-1 leading-snug">Crea tu perfil en segundos</h2>
                <p class="text-gray-600 text-xs md:text-sm">Completa los datos para comenzar</p>
            </div>

            <form id="registerForm" class="w-full flex flex-col gap-2.5 md:gap-3.5">

                <div class="w-full">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 pl-1 font-semibold">Nombre o apodo:</label>
                    <input type="text" id="nombre" class="w-full border border-crono-blue/20 md:border-gray-300 bg-white rounded-full px-4 py-2 md:py-2.5 text-sm focus:outline-none focus:border-crono-blue md:focus:border-crono-teal shadow-2xs md:shadow-none transition-colors text-crono-dark placeholder:text-gray-400" placeholder="Ingresa un apodo" required>
                </div>

                <div class="w-full">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 pl-1 font-semibold">Correo electrónico:</label>
                    <input type="email" id="email" class="w-full border border-crono-blue/20 md:border-gray-300 bg-white rounded-full px-4 py-2 md:py-2.5 text-sm focus:outline-none focus:border-crono-blue md:focus:border-crono-teal shadow-2xs md:shadow-none transition-colors text-crono-dark placeholder:text-gray-400" placeholder="Ingresa un correo electrónico" required>
                </div>

                <div class="w-full">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 pl-1 font-semibold">Contraseña:</label>
                    <input type="password" id="password" class="w-full border border-crono-blue/20 md:border-gray-300 bg-white rounded-full px-4 py-2 md:py-2.5 text-sm focus:outline-none focus:border-crono-blue md:focus:border-crono-teal shadow-2xs md:shadow-none transition-colors text-crono-dark placeholder:text-gray-400" placeholder="Ingresa una contraseña segura" required>
                </div>

                <div class="w-full">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 pl-1 font-semibold">Confirmar contraseña:</label>
                    <input type="password" id="confirmPassword" class="w-full border border-crono-blue/20 md:border-gray-300 bg-white rounded-full px-4 py-2 md:py-2.5 text-sm focus:outline-none focus:border-crono-blue md:focus:border-crono-teal shadow-2xs md:shadow-none transition-colors text-crono-dark placeholder:text-gray-400" placeholder="Repite tu contraseña" required>
                </div>

                <div class="mt-0.5 md:mt-1 w-full">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 md:mb-1.5 pl-1 font-semibold">¿Cómo usarías CronoCare?</label>
                    <div class="flex flex-col gap-1.5 md:gap-2.5 bg-white p-3 md:p-4 rounded-2xl md:rounded-3xl shadow-2xs md:shadow-none border border-crono-blue/20 md:border-gray-300">
                        <label class="flex items-center gap-2.5 md:gap-3 cursor-pointer group">
                            <input type="radio" name="uso" value="personal" checked class="w-4 h-4 accent-crono-blue md:accent-crono-teal text-crono-blue md:text-crono-teal focus:ring-crono-blue">
                            <span class="text-xs md:text-sm text-crono-dark group-hover:text-crono-blue md:group-hover:text-crono-teal transition-colors">Solo para mí (Personal)</span>
                        </label>
                        <label class="flex items-center gap-2.5 md:gap-3 cursor-pointer group">
                            <input type="radio" name="uso" value="cuidador" class="w-4 h-4 accent-crono-blue md:accent-crono-teal text-crono-blue md:text-crono-teal focus:ring-crono-blue">
                            <span class="text-xs md:text-sm text-crono-dark group-hover:text-crono-blue md:group-hover:text-crono-teal transition-colors">Para cuidar a alguien más</span>
                        </label>
                        <label class="flex items-center gap-2.5 md:gap-3 cursor-pointer group">
                            <input type="radio" name="uso" value="ambos" class="w-4 h-4 accent-crono-blue md:accent-crono-teal text-crono-blue md:text-crono-teal focus:ring-crono-blue">
                            <span class="text-xs md:text-sm text-crono-dark group-hover:text-crono-blue md:group-hover:text-crono-teal transition-colors">Ambas</span>
                        </label>
                    </div>
                </div>

                <div id="mensajeRegistro" class="hidden text-red-500 font-semibold text-xs md:text-sm text-center mt-0.5"></div>

                <button type="submit" id="btnRegister" class="mt-1.5 md:mt-2 bg-crono-teal text-white font-bold py-2.5 md:py-3 rounded-full hover:bg-crono-blue transition-colors shadow-sm w-full text-xs md:text-sm tracking-wide">
                    CREAR CUENTA
                </button>
            </form>

            <div class="mt-3 md:mt-5 text-center md:text-left text-xs md:text-sm w-full pl-1">
                <a href="login.html" class="text-crono-blue md:text-crono-dark hover:text-crono-teal hover:underline transition-colors font-semibold md:font-medium">
                    ← Volver al inicio de sesión
                </a>
            </div>

        </div>

    </div>

    <div id="modalCodigo" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">
        <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl border border-crono-blue/20 relative">
            <button type="button" id="btnCerrarModalCodigo"
                    class="absolute top-4 right-4 text-gray-400 hover:text-crono-dark text-xl font-bold leading-none"
                    aria-label="Cerrar ventana">
                &times;
            </button>

            <h3 class="text-lg font-bold text-crono-dark mb-1">Verifica tu correo</h3>
            <p class="text-xs md:text-sm text-gray-600 mb-4">
                Enviamos un código de 8 dígitos a <span id="correoDestinoModal" class="font-semibold text-crono-blue"></span>. Ingrésalo para crear tu cuenta.
            </p>

            <div class="w-full">
                <label for="codigoVerificacion" class="block text-xs md:text-sm text-crono-dark mb-1.5 pl-1 font-semibold">
                    Código de 8 dígitos:
                </label>
                <input type="text" id="codigoVerificacion" maxlength="8" inputmode="numeric" autocomplete="one-time-code"
                       placeholder="00000000"
                       class="w-full border border-crono-blue/30 bg-white rounded-full px-4 py-2.5 text-center text-base tracking-[0.25em] font-semibold focus:outline-none focus:border-crono-teal text-crono-dark">
            </div>

            <div id="mensajeModalCodigo" class="hidden text-red-500 font-semibold text-xs md:text-sm text-center mt-3"></div>

            <button type="button" id="btnConfirmarRegistro" disabled
                    class="mt-4 bg-crono-teal text-white font-bold py-2.5 rounded-full hover:bg-crono-blue transition-colors shadow-sm w-full text-xs md:text-sm tracking-wide opacity-50 cursor-not-allowed">
                CONFIRMAR Y CREAR CUENTA
            </button>
        </div>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
