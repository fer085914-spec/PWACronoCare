<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>

    <!--
      Fondos específicos según el tamaño de pantalla:
    -->
    <style>
        @media (max-width: 767px) {
            body.pc-custom-bg {
                background-color: #E1F4F6;
            }
        }

        @media (min-width: 768px) {
            body.pc-custom-bg {
                background-color: #B9D4DC;
                background-image: url('Images/Ffondo.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
        }
    </style>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light pc-custom-bg font-sans flex flex-col justify-center overflow-x-hidden">

    <!-- Contenedor principal -->
    <div class="w-full max-w-6xl md:max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 items-center px-5 md:px-0 py-4 md:py-0 gap-6 md:gap-0 md:bg-white md:rounded-3xl md:shadow-xl md:overflow-hidden">

        <!-- branding institucional y descripción de CronoCare -->
        <div class="hidden md:flex flex-col items-center justify-center bg-crono-blue text-white px-8 py-12 lg:py-16 text-center self-stretch">
            <div class="w-40 h-40 lg:w-48 lg:h-48 flex items-center justify-center overflow-hidden mb-6">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
            </div>
            <p class="text-base lg:text-lg font-medium leading-relaxed max-w-xs text-white/95">
                Tu asistente para el control y seguimiento de medicamentos
            </p>
        </div>

        <!-- Columna del formulario de acceso -->
        <div class="flex flex-col items-start md:items-center justify-center w-full max-w-sm md:max-w-md mx-auto md:px-10 lg:px-12 md:py-12">

            <div class="flex md:hidden items-center justify-center mb-3 w-full">
                <div class="w-30 h-30 flex items-center justify-center overflow-hidden drop-shadow-xs">
                    <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
                </div>
            </div>

            <!-- Título y subtítulo con borde lateral azul solo en vista móvil -->
            <div class="flex flex-col items-start md:items-center mb-4 md:mb-6 text-left md:text-center w-full border-l-4 border-crono-blue md:border-none pl-3 md:pl-0">
                <h2 class="text-xl md:text-3xl font-bold text-crono-blue md:text-crono-dark mb-0.5 md:mb-1 leading-snug">¡Bienvenido de nuevo!</h2>
                <p class="text-gray-600 text-xs md:text-sm">Ingresa a tu cuenta para continuar</p>
            </div>

            <form id="loginForm" class="w-full flex flex-col gap-3 md:gap-4">
                <div class="w-full text-left">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 md:mb-1.5 pl-3 font-semibold">Correo electrónico:</label>
                    <input type="email" id="email" value="" class="w-full border border-crono-blue/20 md:border-gray-300 bg-white md:bg-[#E8EFF2] rounded-full px-4 md:px-5 py-2 md:py-3 text-sm focus:outline-none focus:border-crono-blue md:focus:border-crono-teal shadow-2xs md:shadow-none transition-colors text-crono-dark placeholder:text-gray-400" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="w-full text-left">
                    <label class="block text-xs md:text-sm text-crono-dark mb-1 md:mb-1.5 pl-3 font-semibold">Contraseña:</label>
                    <input type="password" id="password" value="" class="w-full border border-crono-blue/20 md:border-gray-300 bg-white md:bg-[#E8EFF2] rounded-full px-4 md:px-5 py-2 md:py-3 text-sm focus:outline-none focus:border-crono-blue md:focus:border-crono-teal shadow-2xs md:shadow-none transition-colors text-crono-dark placeholder:text-gray-400" placeholder="********" required>
                </div>

                <!-- Contenedor oculto donde js/login.js muestra mensajes de error o validación -->
                <div id="mensajeLogin" class="hidden text-red-500 font-semibold text-xs md:text-sm text-center mt-0.5"></div>

                <button type="submit" id="btnLogin" class="mt-1.5 md:mt-2 bg-crono-teal text-white font-bold py-2.5 md:py-3 rounded-full hover:bg-crono-blue transition-colors shadow-sm md:shadow-md w-full text-xs md:text-base tracking-wide">
                    INICIAR SESIÓN
                </button>
            </form>

            <!-- Enlace hacia el flujo de registro para usuarios nuevos -->
            <div class="mt-4 md:mt-5 text-center text-xs md:text-sm w-full">
                <p class="text-gray-600 inline">¿Aún no tienes cuenta? </p>
                <a href="registro.html" class="text-crono-blue md:text-crono-teal font-bold hover:underline inline-block">
                    Regístrate aquí
                </a>
            </div>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
